name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check routers/productos.js
          node --check controllers/productosController.js

      - name: Smoke test API
        run: |
          npm start > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://localhost:3000/health | grep -q '^OK$'
          curl --fail --silent http://localhost:3000/api/productos | node --input-type=module -e '
            let body = "";
            for await (const chunk of process.stdin) body += chunk;
            const products = JSON.parse(body);
            if (!Array.isArray(products) || products.length === 0) {
              throw new Error("La API no devolvió una lista de productos válida");
            }
          '